name: Jalankan Google Indexer

on:
  workflow_dispatch: # Bisa dijalankan manual via tab Actions
  schedule:
    - cron: '0 */6 * * *' # Contoh: Berjalan otomatis setiap 6 jam sekali

jobs:
  index-urls:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Jalankan Skrip Indexer
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.index }} # Mengambil dari GitHub Secret 'index'
        run: python indexer.py
